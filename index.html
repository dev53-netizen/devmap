<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Маршрут цілі</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f4f5f7; --panel: rgba(255,255,255,.94); --text: #15171a; --muted: #5f6672;
    --border: rgba(0,0,0,.08); --shadow: 0 6px 24px rgba(0,0,0,.12); --accent: #f76707;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012; --panel: rgba(28,30,34,.94); --text: #eceef1; --muted: #9aa1ab;
      --border: rgba(255,255,255,.08); --shadow: 0 6px 24px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; background: var(--bg); }
  .card { position: fixed; left: 12px; right: 12px; z-index: 500; max-width: 520px; margin: 0 auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #head { top: max(12px, env(safe-area-inset-top)); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  #dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  #title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  #model { color: var(--muted); font-size: 13px; }
  #foot { bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px 14px 12px; }
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .note { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  .leaflet-container { font: inherit; background: var(--bg); }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-bottom { bottom: var(--foot, 0px); }
  .leaflet-top { top: var(--head, 0px); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .leaflet-popup-content { margin: 8px 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="map"></div>
<div id="head" class="card" hidden><span id="dot"></span><div><div id="title"></div><div id="model"></div></div></div>
<div id="foot" class="card" hidden><dl class="rows" id="rows"></dl><div class="note" id="note"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
function decodeTrack(text) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  const bytes = [];
  let bits = 0;
  let acc = 0;
  for (const ch of text) {
    const v = alphabet.indexOf(ch);
    if (v < 0) return [];
    acc = acc * 64 + v;
    bits += 6;
    if (bits >= 8) {
      bits -= 8;
      bytes.push(Math.floor(acc / 2 ** bits) & 255);
      acc %= 2 ** bits;
    }
  }
  const values = [];
  let n = 0;
  let scale = 1;
  for (const byte of bytes) {
    n += (byte & 127) * scale;
    if (byte < 128) {
      values.push(n % 2 === 1 ? -(n + 1) / 2 : n / 2);
      n = 0;
      scale = 1;
    } else scale *= 128;
  }
  const out = [];
  let lat = 0;
  let lon = 0;
  let t = 0;
  for (let i = 0; i + 2 < values.length; i += 3) {
    lat += values[i];
    lon += values[i + 1];
    t += values[i + 2];
    out.push([lon / 1e5, lat / 1e5, t]);
  }
  return out;
}

const TEXTS = {
  uk: {
    title: "Маршрут цілі", first: "Перше виявлення", last: "Остання позиція", points: "Точок",
    span: "Тривалість", length: "Довжина маршруту", km: "км", h: "год", min: "хв",
    note: "Дані приблизні, з відкритих джерел. Лінія з'єднує позиції, якими ціль бачили, — це не точна траєкторія.",
    bad: "У посиланні немає маршруту.",
  },
  en: {
    title: "Target route", first: "First sighted", last: "Last position", points: "Points",
    span: "Duration", length: "Route length", km: "km", h: "h", min: "min",
    note: "Approximate data from open sources. The line joins the positions the target was seen at — not its exact path.",
    bad: "This link carries no route.",
  },
};

const hash = new URLSearchParams(location.hash.slice(1));
const lang = hash.get("l") === "en" ? "en" : "uk";
const t = TEXTS[lang];
document.documentElement.lang = lang;
const color = /^[0-9a-f]{6}$/i.test(hash.get("c") || "") ? "#" + hash.get("c") : "#f76707";
const trail = decodeTrack(hash.get("p") || "").filter(
  ([lon, lat]) => Number.isFinite(lon) && Number.isFinite(lat) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180,
);

const locale = lang === "uk" ? "uk-UA" : "en-GB";
const clock = new Intl.DateTimeFormat(locale, { timeZone: "Europe/Kyiv", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const day = new Intl.DateTimeFormat(locale, { timeZone: "Europe/Kyiv", day: "numeric", month: "long" });
const when = (s) => `${clock.format(new Date(s * 1000))}, ${day.format(new Date(s * 1000))}`;
const duration = (s) => {
  const m = Math.round(s / 60);
  return m >= 60 ? `${Math.floor(m / 60)} ${t.h} ${m % 60} ${t.min}` : `${m} ${t.min}`;
};
const km = (a, b) => {
  const r = Math.PI / 180;
  const x = Math.sin(((b[1] - a[1]) * r) / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(((b[0] - a[0]) * r) / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));
};

if (trail.length === 0 || !window.L) {
  document.body.insertAdjacentHTML("beforeend", '<div class="fail"></div>');
  document.querySelector(".fail").textContent = t.bad;
} else {
  document.documentElement.style.setProperty("--accent", color);
  const name = hash.get("n") || t.title;
  document.title = `${name} · ${t.title}`;
  document.getElementById("title").textContent = name;
  document.getElementById("model").textContent = hash.get("m") || "";
  document.getElementById("head").hidden = false;

  const first = trail[0];
  const last = trail[trail.length - 1];
  let length = 0;
  for (let i = 1; i < trail.length; i++) length += km(trail[i - 1], trail[i]);
  const rows = [
    [t.first, when(first[2])],
    [t.last, when(last[2])],
    ...(trail.length > 1 ? [[t.span, duration(last[2] - first[2])], [t.length, `${Math.round(length)} ${t.km}`]] : []),
    [t.points, String(trail.length)],
  ];
  const dl = document.getElementById("rows");
  for (const [label, value] of rows) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.append(dt, dd);
  }
  document.getElementById("note").textContent = t.note;
  document.getElementById("foot").hidden = false;

  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const map = L.map("map", { zoomControl: false, attributionControl: true });
  const canvas = (layer) =>
    `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark ? "Dark" : "Light"}_Gray_${layer}/MapServer/tile/{z}/{y}/{x}`;
  L.tileLayer(canvas("Base"), {
    maxZoom: 16,
    attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> — Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
  }).addTo(map);
  L.tileLayer(canvas("Reference"), { maxZoom: 16 }).addTo(map);

  const way = trail.map(([lon, lat]) => [lat, lon]);
  L.polyline(way, { color, weight: 6, opacity: 0.25, interactive: false }).addTo(map);
  L.polyline(way, { color, weight: 3, opacity: 0.95, interactive: false }).addTo(map);
  const tip = (label, s) => `${label ? `<b>${label}</b><br>` : ""}${when(s)}`;
  trail.forEach(([lon, lat, s], i) => {
    const end = i === 0 || i === trail.length - 1;
    if (end) return;
    L.circleMarker([lat, lon], { radius: 4, color: "#fff", weight: 1.5, fillColor: color, fillOpacity: 1 })
      .bindPopup(tip("", s))
      .addTo(map);
  });
  L.circleMarker([first[1], first[0]], { radius: 7, color, weight: 3, fillColor: dark ? "#0f1012" : "#fff", fillOpacity: 1 })
    .bindPopup(tip(t.first, first[2]))
    .addTo(map);
  if (trail.length > 1) {
    L.circleMarker([last[1], last[0]], { radius: 8, color: "#fff", weight: 3, fillColor: color, fillOpacity: 1 })
      .bindPopup(tip(t.last, last[2]))
      .addTo(map);
  }

  const fit = () => {
    const head = document.getElementById("head").getBoundingClientRect().bottom + 12;
    const foot = innerHeight - document.getElementById("foot").getBoundingClientRect().top + 12;
    document.documentElement.style.setProperty("--head", `${head}px`);
    document.documentElement.style.setProperty("--foot", `${foot}px`);
    if (trail.length > 1) {
      map.fitBounds(L.latLngBounds(way), { paddingTopLeft: [24, head], paddingBottomRight: [24, foot], maxZoom: 12 });
    } else {
      map.setView(way[0], 11);
    }
  };
  fit();
  addEventListener("resize", fit);
}
</script>
</body>
</html>
